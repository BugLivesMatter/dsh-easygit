<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="EasyGit">
  <defs>
    <linearGradient id="eg-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1530"/>
      <stop offset="1" stop-color="#0c0a16"/>
    </linearGradient>
    <linearGradient id="eg-main" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#eg-bg)" stroke="#3b2f63" stroke-width="1.5"/>
  <!-- main lane -->
  <path d="M20 15v34" stroke="url(#eg-main)" stroke-width="3.4" stroke-linecap="round"/>
  <!-- task lane -->
  <path d="M20 27c8 0 10 4 10 10v12" fill="none" stroke="#2dd4bf" stroke-width="3" stroke-linecap="round"/>
  <!-- extra short branch -->
  <path d="M20 20c10 0 14 3 14 9v5" fill="none" stroke="#f59e0b" stroke-width="2.6" stroke-linecap="round" opacity="0.95"/>
  <!-- commit dots -->
  <circle cx="20" cy="15" r="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <circle cx="20" cy="31" r="4.6" fill="#a78bfa"/>
  <circle cx="20" cy="49" r="4" fill="#c4b5fd"/>
  <circle cx="30" cy="49" r="4.4" fill="#2dd4bf"/>
  <circle cx="34" cy="34" r="3.6" fill="#f59e0b"/>
</svg>
